# generated by make_limits_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 07_limits/results/lumi_linkbw.csv

applications:
  - name: linkbw
    command: "hostname; {env} ROCR_VISIBLE_DEVICES=4 taskset -c 1 ~/finalizing-work/benchmarks/07_limits/linkbw {test} {mib} 5"
    parameters:
      env: ["", "HSA_ENABLE_SDMA=0"]
      test: ["dma_h2d", "dma_d2h", "dma_bidir", "kernel_read", "kernel_write", "kernel_read_s2", "kernel_read_s4", "kernel_write_s2", "kernel_write_s4"]
      mib: [1, 4, 16, 64, 256, 1024]
    metrics:
      machine: "^(\\S+)"
      gbps: "(?:dma|kernel)\\w*: ([0-9.]+)GB/s"
      load_gbps: "load: ([0-9.]+)GB/s"
