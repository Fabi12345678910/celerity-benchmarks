# generated by make_limits_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 07_limits/results/gpuc4_membw.csv

applications:
  - name: membw
    command: "hostname; ~/finalizing-work/benchmarks/07_limits/membw {test} {cpus} {place} 64 5"
    parameters:
      test: ["read", "write", "write_nt", "copy", "copy_nt", "pack2", "pack4", "unpack2", "unpack4"]
      cpus: ["8", "8,10", "8,10,12", "8,10,12,14", "8,10,12,14,6", "8,10,12,14,6,16", "8,10,12,14,6,16,17,18", "8,10,12,14,6,16,17,18,19,20", "8,10,12,14,6,16,17,18,19,20,21,22,23"]
      place: ["local"]
    metrics:
      machine: "^(\\S+)"
      useful_gbps: "useful: ([0-9.]+)GB/s"
      memory_gbps: "memory: ([0-9.]+)GB/s"
