# generated by make_limits_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 07_limits/results/ifi_concurrent.csv

applications:
  - name: linkbw-concurrent
    command: "hostname; taskset -c 1 ~/finalizing-work/benchmarks/07_limits/linkbw {test} 1024 5 {load}"
    parameters:
      test: ["dma_h2d", "dma_d2h"]
      load: ["pack2:5,6", "pack4:5,6", "unpack2:5,6", "unpack4:5,6", "pack2:5,6,8,9", "pack4:5,6,8,9", "unpack2:5,6,8,9", "unpack4:5,6,8,9", "pack2:5,6,7,0,8,9,10,11", "pack4:5,6,7,0,8,9,10,11", "unpack2:5,6,7,0,8,9,10,11", "unpack4:5,6,7,0,8,9,10,11"]
    metrics:
      machine: "^(\\S+)"
      gbps: "(?:dma|kernel)\\w*: ([0-9.]+)GB/s"
      load_gbps: "load: ([0-9.]+)GB/s"
