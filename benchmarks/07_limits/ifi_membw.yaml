# generated by make_limits_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 07_limits/results/ifi_membw.csv

applications:
  - name: membw
    command: "hostname; ~/finalizing-work/benchmarks/07_limits/membw {test} {cpus} {place} 64 5"
    parameters:
      test: ["read", "write", "write_nt", "copy", "copy_nt", "pack2", "pack4", "unpack2", "unpack4"]
      cpus: ["5", "5,6", "5,6,7", "5,6,7,0", "5,6,7,0,8,9", "5,6,7,0,8,9,10,11", "5,6,7,0,8,9,10,11,12,13", "5,6,7,0,8,9,10,11,12,13,14,15", "8,9,10,11", "5,6,8,9"]
      place: ["local"]
    metrics:
      machine: "^(\\S+)"
      useful_gbps: "useful: ([0-9.]+)GB/s"
      memory_gbps: "memory: ([0-9.]+)GB/s"
