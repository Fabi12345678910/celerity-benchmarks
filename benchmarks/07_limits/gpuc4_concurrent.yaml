# generated by make_limits_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 07_limits/results/gpuc4_concurrent.csv

applications:
  - name: linkbw-concurrent
    command: "hostname; taskset -c 1 ~/finalizing-work/benchmarks/07_limits/linkbw {test} 1024 5 {load}"
    parameters:
      test: ["dma_h2d", "dma_d2h"]
      load: ["pack2:8,10", "pack4:8,10", "unpack2:8,10", "unpack4:8,10", "pack2:8,10,12,14", "pack4:8,10,12,14", "unpack2:8,10,12,14", "unpack4:8,10,12,14", "pack2:8,10,12,14,6,16,17,18", "pack4:8,10,12,14,6,16,17,18", "unpack2:8,10,12,14,6,16,17,18", "unpack4:8,10,12,14,6,16,17,18"]
    metrics:
      machine: "^(\\S+)"
      gbps: "(?:dma|kernel)\\w*: ([0-9.]+)GB/s"
      load_gbps: "load: ([0-9.]+)GB/s"
