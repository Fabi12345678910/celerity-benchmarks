# generated by make_yamls.py
iterations: 10
warmup_iterations: 1
output_csv: 24_memcpy/lumi/results/memcpy_4b.csv

applications:
  - name: hip
    command: "hostname; ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/memcpy/memcpy_hip 4 30 pinned"
    parameters:
      env: ["HSA_ENABLE_SDMA=0"]
    metrics:
      machine: '^([^ \n]+)'
      h2d_us: 'H2D: ([0-9.-]+) us median'
      h2d_min_us: 'H2D: [^,]*, ([0-9.-]+) us min'
      h2d_gbps: 'H2D: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      h2d_stream_us: 'H2D: [^\n]*stream ([0-9.-]+) us/copy'
      h2d_submit_us: 'H2D: [^\n]*submit ([0-9.-]+) us/copy'
      d2h_us: 'D2H: ([0-9.-]+) us median'
      d2h_min_us: 'D2H: [^,]*, ([0-9.-]+) us min'
      d2h_gbps: 'D2H: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      d2h_stream_us: 'D2H: [^\n]*stream ([0-9.-]+) us/copy'
      d2h_submit_us: 'D2H: [^\n]*submit ([0-9.-]+) us/copy'
      check: 'Check: ([a-zA-Z]+)'
    static: {celerity: "3dcopylib-bench 2dda28f", program: "memcpy", bytes: 4}

  - name: Celerity-acpp
    command: "hostname; ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/memcpy/memcpy_celerity_acpp 4 30"
    parameters:
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=0 CELERITY_COPYLIB=off"]
    metrics:
      machine: '^([^ \n]+)'
      h2d_us: 'H2D: ([0-9.-]+) us median'
      h2d_min_us: 'H2D: [^,]*, ([0-9.-]+) us min'
      h2d_gbps: 'H2D: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      h2d_stream_us: 'H2D: [^\n]*stream ([0-9.-]+) us/copy'
      h2d_submit_us: 'H2D: [^\n]*submit ([0-9.-]+) us/copy'
      d2h_us: 'D2H: ([0-9.-]+) us median'
      d2h_min_us: 'D2H: [^,]*, ([0-9.-]+) us min'
      d2h_gbps: 'D2H: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      d2h_stream_us: 'D2H: [^\n]*stream ([0-9.-]+) us/copy'
      d2h_submit_us: 'D2H: [^\n]*submit ([0-9.-]+) us/copy'
      h2d_tasks_us: 'H2D tasks: ([0-9.-]+) us median'
      h2d_base_us: 'H2D base: ([0-9.-]+) us median'
      d2h_tasks_us: 'D2H tasks: ([0-9.-]+) us median'
      d2h_base_us: 'D2H base: ([0-9.-]+) us median'
      check: 'Check: ([a-zA-Z]+)'
    static: {celerity: "3dcopylib-bench 2dda28f", program: "memcpy", bytes: 4}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/memcpy/memcpy_celerity_dpcpp0326 4 30"
    parameters:
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=0 CELERITY_COPYLIB=off"]
    metrics:
      machine: '^([^ \n]+)'
      h2d_us: 'H2D: ([0-9.-]+) us median'
      h2d_min_us: 'H2D: [^,]*, ([0-9.-]+) us min'
      h2d_gbps: 'H2D: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      h2d_stream_us: 'H2D: [^\n]*stream ([0-9.-]+) us/copy'
      h2d_submit_us: 'H2D: [^\n]*submit ([0-9.-]+) us/copy'
      d2h_us: 'D2H: ([0-9.-]+) us median'
      d2h_min_us: 'D2H: [^,]*, ([0-9.-]+) us min'
      d2h_gbps: 'D2H: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      d2h_stream_us: 'D2H: [^\n]*stream ([0-9.-]+) us/copy'
      d2h_submit_us: 'D2H: [^\n]*submit ([0-9.-]+) us/copy'
      h2d_tasks_us: 'H2D tasks: ([0-9.-]+) us median'
      h2d_base_us: 'H2D base: ([0-9.-]+) us median'
      d2h_tasks_us: 'D2H tasks: ([0-9.-]+) us median'
      d2h_base_us: 'D2H base: ([0-9.-]+) us median'
      check: 'Check: ([a-zA-Z]+)'
