# generated by make_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 24_memcpy/ifi/results/memcpy.csv

applications:
  - name: hip
    command: "hostname; {env} ~/finalizing-work/build/memcpy/memcpy_hip {bytes} 30 {host}"
    parameters:
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=1"]
      bytes: [4]
      host: [pinned, pageable]
    metrics:
      machine: '^([^ \n]+)'
      h2d_us: 'H2D: ([0-9.-]+) us median'
      h2d_min_us: 'H2D: [^,]*, ([0-9.-]+) us min'
      h2d_gbps: 'H2D: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      h2d_stream_us: 'H2D: [^\n]*stream ([0-9.-]+) us/copy'
      h2d_submit_us: 'H2D: [^\n]*submit ([0-9.-]+) us/copy'
      d2h_us: 'D2H: ([0-9.-]+) us median'
      d2h_min_us: 'D2H: [^,]*, ([0-9.-]+) us min'
      d2h_gbps: 'D2H: [^,]*, [^,]*, ([0-9.-]+) GB/s'
      d2h_stream_us: 'D2H: [^\n]*stream ([0-9.-]+) us/copy'
      d2h_submit_us: 'D2H: [^\n]*submit ([0-9.-]+) us/copy'
      check: 'Check: ([a-zA-Z]+)'
    static: {celerity: "3dcopylib-bench 2dda28f", program: "memcpy"}

