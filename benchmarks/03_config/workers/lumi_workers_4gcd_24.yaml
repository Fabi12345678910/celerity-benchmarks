# generated by make_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 03_config/workers/results/lumi_workers_4gcd_24.csv

applications:
  - name: Celerity-acpp
    command: "hostname; ROCR_VISIBLE_DEVICES={gcds} {env} ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      gcds: ["4,5,2,3"]
      env: ["", "COPYLIB_WORKER_CPUS=all", "COPYLIB_WORKER_CPUS=9,10", "COPYLIB_WORKER_CPUS=9,73", "COPYLIB_WORKER_CPUS=49,50", "CELERITY_THREAD_PINNING=false"]
      N: [8388608]
      M: [1, 2, 3, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench f8d348b"}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && ROCR_VISIBLE_DEVICES={gcds} {env} ~/finalizing-work/build/bench-transfer-dpcpp0326-bench/strided_transfer {N} {M}"
    parameters:
      gcds: ["4,5,2,3"]
      env: ["", "COPYLIB_WORKER_CPUS=all", "COPYLIB_WORKER_CPUS=9,10", "COPYLIB_WORKER_CPUS=9,73", "COPYLIB_WORKER_CPUS=49,50", "CELERITY_THREAD_PINNING=false"]
      N: [8388608]
      M: [1, 2, 3, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench f8d348b"}
