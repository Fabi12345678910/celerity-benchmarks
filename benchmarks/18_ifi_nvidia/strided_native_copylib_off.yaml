# Celerity's own strided copy path (CELERITY_COPYLIB=off) on the NVIDIA node; N up to 2^23 as in 15_sweep3's copylib_off configs
iterations: 3
warmup_iterations: 1
output_csv: 18_ifi_nvidia/results/strided_native_copylib_off.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-transfer-acpp-cuda-bench/strided_transfer {N} {M}"
    parameters:
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608]
      M: [1, 2]
      env: ["CELERITY_COPYLIB=off"]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_transfer", variant: "native", config: "strided_native_copylib_off", gpu: "RTX 2070"}
