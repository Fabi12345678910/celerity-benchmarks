# generated by make_verify_yamls.py
iterations: 5
warmup_iterations: 1
output_csv: 14_verify/results/ifi_rows_acpp.csv

applications:
  - name: Celerity-acpp
    command: "hostname; CELERITY_COPYLIB_QUEUES=2 COPYLIB_WORKER_CPUS=inherit COPYLIB_PLAN_ORDER=block COPYLIB_PRELOAD_KERNELS=0 COPYLIB_MAX_ELEM_SIZE=64 ~/finalizing-work/build/bench-rows-acpp-bench/strided_rows_transfer {N} 64 {W}"
    parameters:
      N: [16384, 65536, 262144, 1048576, 4194304, 16777216]
      W: [1, 8, 32]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_rows_transfer", config: "staging_old", variant: "staging", env: "CELERITY_COPYLIB_QUEUES=2 COPYLIB_WORKER_CPUS=inherit COPYLIB_PLAN_ORDER=block COPYLIB_PRELOAD_KERNELS=0 COPYLIB_MAX_ELEM_SIZE=64"}

  - name: Celerity-acpp
    command: "hostname; ~/finalizing-work/build/bench-rows-acpp-bench/strided_rows_transfer {N} 64 {W}"
