# generated by make_slots_yamls.py
iterations: 5
warmup_iterations: 1
output_csv: 13_hk_probe/results/lumi_slots.csv

applications:
  - name: w_s4_p8
    command: "hostname; ROCR_VISIBLE_DEVICES=4 taskset -c 5 ~/finalizing-work/benchmarks/13_hk_probe/hk_probe w 4 8 4 {rows} default {order} 5"
    parameters:
      rows: [16384, 262144, 2097152]
      order: ["natural", "filter", "phase"]
    metrics:
      machine: "^(\\S+)"
      gbps: "probe: ([0-9.]+)GB/s"
      mrows_per_s: "rows/s=([0-9.]+)M"
      check: "check=(\\w+)"
      device: "device=(\\S+)"
    static: {study: "slots", S: 4, P: 8, E: 4}

