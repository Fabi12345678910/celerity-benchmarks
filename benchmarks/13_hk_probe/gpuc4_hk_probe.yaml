  - name: celerity_hk
    command: "hostname; COPYLIB_WORKER_CPUS=8,10 COPYLIB_HOST_KERNEL=1 ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      N: [1048576, 16777216]
      M: [2, 4, 8, 16, 64]
    metrics:
      machine: "^(\\S+)"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
    static: {study: "hk_probe", tool: "Celerity-acpp", celerity: "3dcopylib-bench 014e21a"}

  - name: celerity_staging
