# generated by make_hk_probe_yamls.py
iterations: 10
warmup_iterations: 1
output_csv: 13_hk_probe/results/gpuc4_hk_probe.csv

applications:
  - name: w_pitch
    command: "hostname; taskset -c 8 ~/finalizing-work/benchmarks/13_hk_probe/hk_probe {dir} {S} {P} {E} {rows} default {order} 5"
    parameters:
      dir: ["w"]
      S: [4]
      P: [8, 12, 16, 24, 32, 48, 64, 128, 256]
      E: [4]
      rows: [2097152]
      order: ["natural"]
    metrics:
      machine: "^(\\S+)"
      gbps: "probe: ([0-9.]+)GB/s"
      mrows_per_s: "rows/s=([0-9.]+)M"
      check: "check=(\\w+)"
    static: {study: "hk_probe", tool: "hk_probe"}

  - name: w_pitch_far
    command: "hostname; taskset -c 8 ~/finalizing-work/benchmarks/13_hk_probe/hk_probe {dir} {S} {P} {E} {rows} default {order} 5"
