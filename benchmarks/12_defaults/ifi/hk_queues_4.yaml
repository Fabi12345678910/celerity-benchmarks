# generated by make_defaults_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 12_defaults/ifi/results/hk_queues_4.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      env: ["COPYLIB_WORKER_CPUS=5,6,7,0 COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=16777216"]
      N: [65536, 262144, 1048576, 4194304, 16777216, 67108864, 268435456]
      M: [2, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 014e21a", program: "strided_transfer", variant: "host kernel", config: "hk_queues_4", W: 1}

