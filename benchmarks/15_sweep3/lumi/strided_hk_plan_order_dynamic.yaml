# generated by make_sweep3_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 15_sweep3/lumi/results/strided_hk_plan_order_dynamic.csv

applications:
  - name: Celerity-acpp
    command: "hostname; ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      env: ["COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PLAN_ORDER=dynamic"]
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456]
      M: [1, 2, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_transfer", variant: "host kernel", config: "strided_hk_plan_order_dynamic", option: "plan_order", value: "dynamic", prefix: "ROCR_VISIBLE_DEVICES=4"}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/bench-transfer-dpcpp0326-bench/strided_transfer {N} {M}"
    parameters:
      env: ["COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PLAN_ORDER=dynamic"]
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456]
      M: [1, 2, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_transfer", variant: "host kernel", config: "strided_hk_plan_order_dynamic", option: "plan_order", value: "dynamic", prefix: "ROCR_VISIBLE_DEVICES=4"}
