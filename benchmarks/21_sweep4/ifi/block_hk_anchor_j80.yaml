# generated by make_sweep4_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 21_sweep4/ifi/results/block_hk_anchor_j80.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-transfer-acpp-bench/block_transfer {N}"
    parameters:
      env: ["CELERITY_COPYLIB_ROUTE=all HSA_ENABLE_SDMA=0 COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256"]
      N: [65536, 1048576, 16777216, 268435456]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "block_transfer", variant: "host kernel", config: "block_hk_anchor_j80", option: "anchor", value: "j80"}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/bench-transfer-dpcpp0326-bench/block_transfer {N}"
    parameters:
      env: ["CELERITY_COPYLIB_ROUTE=all HSA_ENABLE_SDMA=0 COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256"]
      N: [65536, 1048576, 16777216, 268435456]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "block_transfer", variant: "host kernel", config: "block_hk_anchor_j80", option: "anchor", value: "j80"}
