# generated by make_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 23_overhead/ifi/results/overhead_celerity_native.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/overhead/overhead_celerity_acpp {tasks} {elems} {buffers} 7 200 {strided}"
    parameters:
      env: ["HSA_ENABLE_SDMA=0 CELERITY_COPYLIB=off"]
      tasks: [100, 1000]
      elems: [1, 1024]
      buffers: [1, 64]
      strided: [1]
    metrics:
      machine: "^(\\S+)"
      submit_us_per_task: "Submit: ([0-9.]+) us/task"
      total_us_per_task: "Total: ([0-9.]+) us/task"
      drain_us: "Drain: ([0-9.]+) us"
      latency_us: "Latency: ([0-9.]+) us"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "overhead", variant: "strided copy per task, native", config: "overhead_celerity_native"}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/overhead/overhead_celerity_dpcpp0326 {tasks} {elems} {buffers} 7 200 {strided}"
    parameters:
      env: ["HSA_ENABLE_SDMA=0 CELERITY_COPYLIB=off"]
      tasks: [100, 1000]
      elems: [1, 1024]
      buffers: [1, 64]
      strided: [1]
    metrics:
      machine: "^(\\S+)"
      submit_us_per_task: "Submit: ([0-9.]+) us/task"
      total_us_per_task: "Total: ([0-9.]+) us/task"
      drain_us: "Drain: ([0-9.]+) us"
      latency_us: "Latency: ([0-9.]+) us"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "overhead", variant: "strided copy per task, native", config: "overhead_celerity_native"}
