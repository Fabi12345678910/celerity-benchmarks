# generated by make_yamls.py --smoke
iterations: 1
warmup_iterations: 0
output_csv: 23_overhead/gpuc4/results/smoke/overhead_plain.csv

applications:
  - name: hip
    command: "hostname; {env} ~/finalizing-work/build/overhead/overhead_hip {tasks} {elems} {buffers} 7 200"
    parameters:
      env: ["HSA_ENABLE_SDMA=0"]
      tasks: [100, 1000]
      elems: [1, 1048576]
      buffers: [1, 64]
    metrics:
      machine: "^(\\S+)"
      submit_us_per_task: "Submit: ([0-9.]+) us/task"
      total_us_per_task: "Total: ([0-9.]+) us/task"
      drain_us: "Drain: ([0-9.]+) us"
      latency_us: "Latency: ([0-9.]+) us"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "overhead", variant: "plain", config: "overhead_plain"}

  - name: opencl
    command: "hostname; {env} ~/finalizing-work/build/overhead/overhead_opencl {tasks} {elems} {buffers} 7 200"
    parameters:
      env: ["HSA_ENABLE_SDMA=0"]
      tasks: [100, 1000]
      elems: [1, 1048576]
      buffers: [1, 64]
    metrics:
      machine: "^(\\S+)"
      submit_us_per_task: "Submit: ([0-9.]+) us/task"
      total_us_per_task: "Total: ([0-9.]+) us/task"
      drain_us: "Drain: ([0-9.]+) us"
      latency_us: "Latency: ([0-9.]+) us"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "overhead", variant: "plain", config: "overhead_plain"}

  - name: SYCL-acpp
    command: "hostname; {env} ~/finalizing-work/build/overhead/overhead_acpp {tasks} {elems} {buffers} 7 200"
    parameters:
      env: ["HSA_ENABLE_SDMA=0"]
      tasks: [100, 1000]
      elems: [1, 1048576]
      buffers: [1, 64]
    metrics:
      machine: "^(\\S+)"
      submit_us_per_task: "Submit: ([0-9.]+) us/task"
      total_us_per_task: "Total: ([0-9.]+) us/task"
      drain_us: "Drain: ([0-9.]+) us"
      latency_us: "Latency: ([0-9.]+) us"
      check: "Check: (\\w+)"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "overhead", variant: "plain", config: "overhead_plain"}

  - name: SYCL-dpcpp
