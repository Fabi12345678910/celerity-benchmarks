# generated by make_preload_yamls.py
iterations: 8
warmup_iterations: 1
output_csv: 17_preload/ifi/results/preload_gc22.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      N: [1, 1024, 65536, 1048576, 16777216]
      M: [1, 2]
      env: ["COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PRELOAD_KERNELS=0", "COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PRELOAD_KERNELS=1", "CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_PRELOAD_KERNELS=0", "CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_PRELOAD_KERNELS=1"]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_transfer", config: "preload_gc22"}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/bench-transfer-dpcpp0326-bench/strided_transfer {N} {M}"
    parameters:
      N: [1, 1024, 65536, 1048576, 16777216]
      M: [1, 2]
      env: ["COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PRELOAD_KERNELS=0", "COPYLIB_HOST_KERNEL=1 CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_MAX_ELEM_SIZE=4 COPYLIB_ELEMS_PER_ITEM=4 COPYLIB_WG_SIZE=256 COPYLIB_PRELOAD_KERNELS=1", "CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_PRELOAD_KERNELS=0", "CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_CHUNK_BYTES=1048576 COPYLIB_PRELOAD_KERNELS=1"]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 2dda28f", program: "strided_transfer", config: "preload_gc22"}

