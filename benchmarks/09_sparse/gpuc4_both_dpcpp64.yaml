# generated by make_sparse_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 09_sparse/results/gpuc4_both_dpcpp64.csv

applications:
  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/bench-both_strided-dpcpp0326-bench/strided_both_transfer {N} {M}"
    parameters:
      env: ["CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_STAGING_BYTES=16777216 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=8,10,12,14 COPYLIB_PLAN_ORDER=dynamic", "CELERITY_COPYLIB_QUEUES=4 CELERITY_COPYLIB_STAGING_BYTES=16777216 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=8,10,12,14 COPYLIB_PLAN_ORDER=dynamic COPYLIB_HOST_KERNEL=1"]
      N: [4194304, 16777216]
      M: [64]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 014e21a", program: "strided_both_transfer"}
