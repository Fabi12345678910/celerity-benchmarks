# the "after fastpath" line below 2^22 rows: Celerity c4ee4f1 (built by build_state.sh), the sweep base of that time (two pinned workers) as in 05_fastpath
iterations: 3
warmup_iterations: 1
output_csv: 02_comparison/results/fastpath_small_lumi.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {base} ~/finalizing-work/build/bench-transfer-acpp-c4ee4f1/strided_transfer {N} {M}"
    parameters:
      base: ["ROCR_VISIBLE_DEVICES=4 COPYLIB_WORKER_CPUS=5,6"]
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216]
      M: [2]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench c4ee4f1"}
