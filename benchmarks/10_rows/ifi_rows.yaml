# generated by make_rows_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 10_rows/results/ifi_rows.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-rows-acpp-bench/strided_rows_transfer {N} 64 {W}"
    parameters:
      env: ["CELERITY_COPYLIB_QUEUES=8 CELERITY_COPYLIB_STAGING_BYTES=33554432 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=5,6,7,0,8,9,10,11 COPYLIB_PLAN_ORDER=dynamic", "CELERITY_COPYLIB_QUEUES=8 CELERITY_COPYLIB_STAGING_BYTES=33554432 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=5,6,7,0,8,9,10,11 COPYLIB_PLAN_ORDER=dynamic COPYLIB_HOST_KERNEL=1"]
      N: [16384, 65536, 262144, 1048576, 4194304, 16777216]
      W: [1, 8, 16, 32, 64]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 014e21a", program: "strided_rows_transfer", M: 64}

  - name: Celerity-dpcpp
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/bench-rows-dpcpp0326-bench/strided_rows_transfer {N} 64 {W}"
    parameters:
      env: ["CELERITY_COPYLIB_QUEUES=8 CELERITY_COPYLIB_STAGING_BYTES=33554432 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=5,6,7,0,8,9,10,11 COPYLIB_PLAN_ORDER=dynamic", "CELERITY_COPYLIB_QUEUES=8 CELERITY_COPYLIB_STAGING_BYTES=33554432 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=5,6,7,0,8,9,10,11 COPYLIB_PLAN_ORDER=dynamic COPYLIB_HOST_KERNEL=1"]
      N: [16384, 65536, 262144, 1048576, 4194304, 16777216]
      W: [1, 8, 16, 32, 64]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 014e21a", program: "strided_rows_transfer", M: 64}
