# generated by make_core_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 06_cores/lumi/results/workers_32_dynamic.csv

applications:
  - name: Celerity-acpp
    command: "hostname; ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/bench-transfer-acpp-bench/strided_transfer {N} {M}"
    parameters:
      env: ["CELERITY_COPYLIB_QUEUES=32 CELERITY_COPYLIB_STAGING_BYTES=134217728 CELERITY_COPYLIB_CHUNK_BYTES=4194304 COPYLIB_WORKER_CPUS=5,6,7,9,10,11,12,13,14,15,17,18,19,20,21,22,23,25,26,27,28,29,30,31,33,34,35,36,37,38,39,41 COPYLIB_PLAN_ORDER=dynamic"]
      N: [65536, 262144, 1048576, 4194304, 16777216, 67108864, 268435456]
      M: [2, 4]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "3dcopylib-bench 014e21a", prefix: "ROCR_VISIBLE_DEVICES=4"}

  - name: Celerity-dpcpp
