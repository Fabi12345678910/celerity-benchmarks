# generated by make_lines_yamls.py
iterations: 3
warmup_iterations: 1
output_csv: 26_published/ifi/results/lines_ifi.csv

applications:
  - name: Celerity-acpp
    command: "hostname; {env} ~/finalizing-work/build/bench-transfer-acpp-published/strided_transfer {N} {M}"
    parameters:
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456]
      M: [1, 2]
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=0 COPYLIB_HOST_KERNEL=1"]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "celerity-runtime master 536d754 (published), gpu3dcopylib 843fafe", program: "strided_transfer", config: "defaults_and_host_kernel"}

  - name: Celerity-dpcpp0326
    command: "hostname; . ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && {env} ~/finalizing-work/build/bench-transfer-dpcpp0326-published/strided_transfer {N} {M}"
    parameters:
      N: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456]
      M: [1, 2]
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=0 COPYLIB_HOST_KERNEL=1"]
    metrics:
      machine: "^(\\S+)"
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      data_size_gib: "Worked on Data Size:\\s*([0-9.]+)\\s*GiB"
    static: {celerity: "celerity-runtime master 536d754 (published), gpu3dcopylib 843fafe", program: "strided_transfer", config: "defaults_and_host_kernel"}
