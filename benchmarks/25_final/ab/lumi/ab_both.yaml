# generated by make_ab_yamls.py
iterations: 5
warmup_iterations: 1
output_csv: 25_final/ab/lumi/results/ab_both.csv

applications:
  - name: final2-acpp
    command: "hostname; ROCR_VISIBLE_DEVICES=4 {env} ~/finalizing-work/build/bench-both_strided-acpp-final2/strided_both_transfer {N} {M}"
    parameters:
      N: [1048576, 4194304, 16777216]
      M: [2, 64]
      env: ["HSA_ENABLE_SDMA=0", "HSA_ENABLE_SDMA=0 COPYLIB_HOST_KERNEL=1"]
    metrics:
      machine: "^(\\S+)"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      check: "Check: (\\w+)"
    static: {build: "final2", impl: "acpp", celerity: "3dcopylib-final 81b2cb2", program: "strided_both_transfer"}

  - name: final2-dpcpp0326
