iterations: 5
warmup_iterations: 2
output_csv: block_transfer_results.csv

applications:
  - name: acpp
    command: "~/finalizing-work/build/bench-transfer-acpp-bench/block_transfer {data_size}"
    parameters:
      data_size: [8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912, 1073741824]
    metrics:
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      check: "Check: (\\w+)"
    static: {sycl: "AdaptiveCpp v25.10.0 generic", celerity: "3dcopylib-bench af82e39"}
  - name: dpcpp0326
    command: ". ~/finalizing-work/install/dpcpp-nightly-2026-03-26/env.sh && ~/finalizing-work/build/bench-transfer-dpcpp0326-bench/block_transfer {data_size}"
    parameters:
      data_size: [8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912, 1073741824]
    metrics:
      buffer_creation_gbps: "buffer creation:.*?([0-9]+\\.[0-9]+)GB/s"
      copy_bandwidth: "first access.*?:.*?([0-9]+\\.[0-9]+)GB/s"
      read_only_gbps: "read only:.*?([0-9]+\\.[0-9]+)GB/s"
      read_write_gbps: "read write:.*?([0-9]+\\.[0-9]+)GB/s"
      d2h_gbps: "device to host:.*?([0-9]+\\.[0-9]+)GB/s"
      full_data_size_gib: "Data Size:\\s*([0-9.]+)\\s*GiB"
      check: "Check: (\\w+)"
    static: {sycl: "DPC++ nightly-2026-03-26", celerity: "3dcopylib-bench af82e39"}
